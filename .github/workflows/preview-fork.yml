# Publish @rspack/* preview packages from a fork via pkg.pr.new.
# Install the pkg.pr.new GitHub App on your fork before running:
# https://pkg.pr.new
#
# Example install on a remote machine:
#   npm install https://pkg.pr.new/${{ github.repository }}/@rspack/core@${{ github.sha }}
#   npm install https://pkg.pr.new/${{ github.repository }}/@rspack/cli@${{ github.sha }}
name: Preview Fork

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: common
        options:
          - common
          - all

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: '"ubuntu-22.04"'
            group: common
          - target: x86_64-pc-windows-msvc
            runner: '"windows-latest"'
            group: common
          - target: aarch64-apple-darwin
            runner: '"macos-latest"'
            group: common
          - target: aarch64-unknown-linux-gnu
            runner: '"ubuntu-22.04"'
            group: all
          - target: x86_64-unknown-linux-musl
            runner: '"ubuntu-22.04"'
            group: all
          - target: aarch64-unknown-linux-musl
            runner: '"ubuntu-22.04"'
            group: all
          - target: i686-pc-windows-msvc
            runner: '"windows-latest"'
            group: all
          - target: aarch64-pc-windows-msvc
            runner: '"windows-latest"'
            group: all
          - target: x86_64-apple-darwin
            runner: '"macos-latest"'
            group: all
    if: ${{ matrix.group == 'common' || inputs.platforms == 'all' }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      profile: release
      test: false

  publish:
    name: Publish preview packages
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Pnpm Setup
        uses: ./.github/actions/pnpm/setup

      - name: Pnpm Install
        run: pnpm i

      - name: Download artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          path: artifacts

      - name: Build node packages
        run: pnpm run build:js

      - name: Move artifacts
        run: node scripts/build-npm.cjs

      - name: Show binding packages
        run: ls -R npm

      - name: Publish to pkg.pr.new
        run: npx pkg-pr-new publish --compact --pnpm './npm/*' './crates/node_binding' './packages/rspack' './packages/rspack/cli'

      - name: Print install commands
        run: |
          repo='${{ github.repository }}'
          sha='${{ github.sha }}'
          short_sha="${sha:0:7}"
          echo "## Install with npm"
          echo "npm install https://pkg.pr.new/${repo}/@rspack/core@${short_sha}"
          echo "npm install https://pkg.pr.new/${repo}/@rspack/cli@${short_sha}"
          echo ""
          echo "## Install with pnpm"
          echo "pnpm add https://pkg.pr.new/${repo}/@rspack/core@${short_sha}"
          echo "pnpm add https://pkg.pr.new/${repo}/@rspack/cli@${short_sha}"
